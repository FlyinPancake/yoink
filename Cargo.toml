[workspace]
members  = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.8"
edition = "2024"

[workspace.dependencies]
migration = { path = "crates/yoink-migration" }

argon2 = "0.5"
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["form", "json", "macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
color-eyre = "0.6.5"
cookie = "0.18"
deunicode = "1"
dotenvy = "0.15.7"
envious = "0.3.0"
governor = "0.10"
http = "1"
lofty = "0.24"
lrclib-api-rs = "0.3"
mime_guess = "2"
musicbrainz_rs = { version = "0.13", features = [
  "rate_limit",
  "async",
  "rustls",
], default-features = false }
oas3-gen-support = "0.26.2"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
  "query",
] }
roxmltree = "0.21"
rust-embed = { version = "8", features = ["mime-guess"] }
sea-orm = { version = "2.0.0-rc.42", features = [
  "sqlx-sqlite",
  "sqlx-postgres",
  "with-uuid",
  "with-chrono",
  "runtime-tokio-rustls",
  "schema-sync",
  "entity-registry",
  "macros",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_trim = "1.1.0"
serde_with = "3.21.0"
sha2 = "0.11"
strsim = "0.11"
snafu = { version = "0.9", features = ["futures"] }
tempfile = "3.27.0"
thiserror = "2"
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "rt-multi-thread",
  "sync",
  "signal",
] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7.18"
tower = "0.5"
tower-http = { version = "0.7.0", features = ["normalize-path", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "fmt",
  "json",
] }
url = { version = "2.5.8", features = ["serde"] }
utoipa = { version = "5.5.0", features = [
  "axum_extras",
  "chrono",
  "uuid",
  "url",
] }
utoipa-axum = "0.2.0"
utoipa-scalar = { version = "0.3.0", features = ["axum"] }
uuid = { version = "1", features = ["v7", "serde"] }
validator = { version = "0.20", features = ["derive"] }
veil = "0.3"
